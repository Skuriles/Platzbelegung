<h2 mat-dialog-title>Event erstellen</h2>
<mat-dialog-content class="mat-typography">
  <div class="login">
    <form class="example-form">
      <section class="example-section">
        <mat-checkbox
          class="example-margin"
          [(ngModel)]="event.allDay"
          (ngModelChange)="allDayChanged($event)"
          name="allday"
          >Ganztag-Event</mat-checkbox
        >
      </section>
      @if (!event.allDay) {
        <div>
          <mat-form-field class="example-full-width">
            <mat-label>Start</mat-label>
            <input
              matInput
              type="datetime-local"
              placeholder="Start"
              [ngModel]="event.startDatetime.toJSDate() | date : dateFormat"
              (ngModelChange)="startDateChanged($event)"
              (click)="$event.target.showPicker()"
              name="start"
            />
          </mat-form-field>
          <mat-form-field class="example-full-width">
            <mat-label>Ende</mat-label>
            <input
              matInput
              type="datetime-local"
              placeholder="Ende"
              [ngModel]="event.endDatetime.toJSDate() | date : dateFormat"
              (ngModelChange)="event.enddateStr = $event"
              (click)="$event.target.showPicker()"
              name="ende"
            />
          </mat-form-field>
        </div>
      } @else {
        <div>
          <mat-form-field appearance="fill">
            <mat-label>Zeitraum eingeben</mat-label>
            <mat-date-range-input [rangePicker]="picker">
              <input
                matStartDate
                [(ngModel)]="event.start"
                placeholder="Start Datum"
                (click)="picker.open()"
                name="allDayStart"
              />
              <input
                matEndDate
                [(ngModel)]="event.end"
                placeholder="Ende Datum"
                (click)="picker.open()"
                name="allDayEnd"
              />
            </mat-date-range-input>
            <mat-hint>MM.DD.YYYY – MM.DD.YYYY</mat-hint>
            <mat-datepicker-toggle
              matSuffix
              [for]="picker"
            ></mat-datepicker-toggle>
            <mat-date-range-picker #picker></mat-date-range-picker>
          </mat-form-field>
        </div>
      }
      @if (!event.allDay) {
        <section class="example-section">
          <mat-checkbox
            class="example-margin"
            [(ngModel)]="event.repeats"
            name="repeatCb"
            >Wiederholt sich?</mat-checkbox
          >
        </section>
      }
      @if (event.repeats) {
        <section>
          <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>Wiederholen bis</mat-label>
            <input
              matInput
              [matDatepicker]="picker2"
              [(ngModel)]="event.repeatsEndDate"
              (click)="picker2.open()"
              name="repeatend"
            />
            <mat-hint>MM.DD.YYYY</mat-hint>
            <mat-datepicker-toggle
              matSuffix
              [for]="picker2"
            ></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
          </mat-form-field>
        </section>
        <section>
          <mat-label>Wochentage</mat-label>
          <mat-chip-listbox
            #chipList
            aria-label="Wochentage"
            multiple
            selectable
            name="weekdays"
          >
            <mat-chip
              *ngFor="let day of weekdays"
              (click)="toggleSelection(day)"
              [value]="day"
              [selected]="event.customDays.indexOf(day) > -1"
            >
              {{ day }}
            </mat-chip>
          </mat-chip-listbox>
        </section>
      }
      <mat-form-field class="example-full-width">
        <mat-label>Titel</mat-label>
        <input
          matInput
          placeholder="Titel"
          [(ngModel)]="event.title"
          name="title"
        />
      </mat-form-field>
      <mat-form-field class="example-full-width">
        <mat-label>Details</mat-label>
        <textarea
          matInput
          placeholder="Details"
          [(ngModel)]="event.details"
          name="details"
        ></textarea>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Gelände</mat-label>
        <mat-select name="ort" multiple [(ngModel)]="event.orte">
          <mat-option *ngFor="let val of orte" [value]="val">{{
            val
          }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field class="example-full-width">
        <mat-label>Ansprechpartner</mat-label>
        <input
          matInput
          placeholder="Person"
          [(ngModel)]="event.person"
          name="person"
        />
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Abbrechen</button>
  <button mat-flat-button color="accent" (click)="apply()" cdkFocusInitial>
    Speichern
  </button>
</mat-dialog-actions>
